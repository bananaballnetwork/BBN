<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BBN - Banana Ball Network</title>
<meta name="theme-color" content="#0d0d14"/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 :root{--ink:#0d0d14;--accent:#FFD700;--accent-ink:#0d0d14;--paper:#fff;--bg:#f2f2f5;--line:#e2e2ea}
 body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:64px}
 .app{max-width:900px;margin:0 auto;padding:0 0 20px}
 .masthead{background:#fff;color:var(--ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent)}
 .wordmark-logo{height:40px;width:auto;display:block}
 .admin-link{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
 .page{display:none;padding:16px}
 .page.active{display:block}
 h2{font-family:'Bangers',cursive;font-size:22px;letter-spacing:0.5px;margin-bottom:12px}
 .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
 .loading{display:flex;align-items:center;gap:10px;color:#8a8a96;padding:20px 0;font-size:14px}
 .spinner{width:16px;height:16px;border:2px solid #e2e2ea;border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .no-content{text-align:center;color:#a0a0ae;padding:40px 16px;font-size:14px}

 .article-body{font-size:14px;line-height:1.7;white-space:pre-wrap;color:#2a2a36}
 .back-link{display:inline-block;margin-bottom:12px;color:#8a7300;font-weight:600;font-size:13px;cursor:pointer}

 .day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:none}
 .day-tabs::-webkit-scrollbar{display:none}
 .day-tab{flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:#4a4a56;text-align:center;min-width:64px}
 .day-tab .dow{display:block;font-size:10px;color:#9a9aa8;text-transform:uppercase;margin-bottom:2px}
 .day-tab.active{background:var(--accent);border-color:var(--accent);color:var(--ink)}
 .day-tab.active .dow{color:rgba(255,255,255,0.6)}

 .matchup-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
 .matchup-row{display:flex;justify-content:space-between;align-items:center}
 .matchup-team{font-weight:700;font-size:14px}
 .matchup-record{font-size:11px;color:#9a9aa8}
 .matchup-vs{text-align:center;color:#c7c7d1;font-size:11px;font-weight:700;padding:0 10px}
 .matchup-meta{text-align:center;font-size:11px;color:#9a9aa8;margin-top:8px}

 .game-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
 .game-tabs::-webkit-scrollbar{display:none}
 .game-tab-btn{flex-shrink:0;padding:10px 12px;background:none;border:none;border-bottom:3px solid transparent;color:#9a9aa8;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;cursor:pointer}
 .game-tab-btn.active{color:var(--ink);border-bottom-color:var(--accent)}
 .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
 .stat-row:last-child{border-bottom:none}
 .stat-label{color:#4a4a56}
 .stat-val{font-weight:700}
 .section-label{font-size:11px;color:#8a8a96;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:8px}
 .xbh-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
 .xbh-row:last-child{border-bottom:none}
 .xbh-badge{font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;flex-shrink:0;color:#fff}
 .box-table{width:100%;border-collapse:collapse;font-size:12px}
 .box-table th{text-align:left;color:#9a9aa8;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
 .box-table td{padding:6px 4px;border-bottom:1px solid #f0f0f4}
 .box-table th:not(:first-child),.box-table td:not(:first-child){text-align:center}

 .watch-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
 .watch-row:last-child{border-bottom:none}
 .watch-thumb{width:110px;height:62px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#ddd}
 .watch-info-title{font-weight:700;font-size:13px}
 .watch-info-meta{font-size:11px;color:#9a9aa8;margin-top:3px}

 .reels-feed{height:calc(100vh - 230px);min-height:420px;max-height:800px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;border-radius:14px;background:#0b0b12;scrollbar-width:none}
 .reels-feed::-webkit-scrollbar{display:none}
 .reels-feed.fullscreen-mode{position:fixed;top:0;left:50%;transform:translateX(-50%);height:100dvh;width:100%;max-width:480px;border-radius:0;z-index:80;margin:0}
 .reel-item{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#0b0b12;overflow:hidden}
 .reel-frame{width:100%;max-height:100%;aspect-ratio:16/9;position:relative}
 .fullscreen-mode .reel-frame{width:100%;height:100%;max-height:100%;aspect-ratio:auto}
 .reel-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none;pointer-events:none}
 .reel-frame.controls-active iframe{pointer-events:auto}
 .reel-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6);cursor:pointer}
 .reel-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);pointer-events:none}
 .reel-info{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 20px;background:linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0));color:#fff;z-index:2;pointer-events:none}
 .reel-category-badge{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700;margin-bottom:6px}
 .reel-title{font-family:'Bangers',cursive;font-size:20px;line-height:1.15;margin-bottom:3px}
 .reel-meta{font-size:12px;opacity:0.9;margin-bottom:4px;font-weight:600}
 .reel-mute-btn{position:absolute;top:14px;right:14px;z-index:3;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
 .reel-controls-toggle{position:absolute;bottom:96px;right:14px;z-index:3;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
 .reel-controls-toggle.active{background:var(--accent);color:var(--accent-ink)}
 .reels-back-btn{display:none;position:fixed;top:14px;left:14px;z-index:90;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
 #page-reels.active .reels-back-btn{display:block}
 #page-reels>h2{display:none}

 .bottom-tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:70}
 .bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#9a9aa8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;padding:6px 4px;border-radius:8px}
 .bottom-tab.active{color:var(--ink);background:#fff8d6}
 .bottom-tab-icon{font-size:19px;line-height:1}

 .input-group{margin-bottom:10px}
 .input-group label{display:block;font-size:12px;color:#6b6b78;margin-bottom:4px;font-weight:600}
 .modal-input,.admin-textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px}
 .admin-textarea{resize:vertical}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .admin-btn{background:var(--accent);color:var(--ink);border:none;padding:11px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;font-family:'DM Sans',sans-serif;width:100%;margin-top:6px}
 .result-btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
 .auth-error{color:#d64545;font-size:12px;margin-bottom:8px;min-height:14px}
 .admin-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
 .admin-item small{color:#9a9aa8;display:block;margin-top:2px}
 .admin-section{margin-bottom:20px}
 .admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
 .admin-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto}
 details summary{cursor:pointer;font-weight:700;color:var(--ink);padding:4px 0;list-style:none}
</style>
</head>

function toast(msg, dur=2600) {
 let t = document.getElementById('bbn-toast');
 if (!t) {
 t = document.createElement('div'); t.id='bbn-toast';
 t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0d0d14;color:#FFD700;padding:10px 18px;border-radius:50px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.25)';
 document.body.appendChild(t);
 }
 t.textContent = msg; t.style.display='block';
 clearTimeout(t._timer); t._timer = setTimeout(()=>t.style.display='none', dur);
}
function setError(id, msg) { const el = document.getElementById(id); if (el) el.textContent = msg; }
function escapeHtml(str) { if (str===null||str===undefined) return ''; const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str) { if (str===null||str===undefined) return ''; return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function extractYouTubeId(input) {
 if (!input) return null;
 const s = input.trim();
 if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
 const patterns = [/(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtube\.com\/embed\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/];
 for (const re of patterns) { const m = s.match(re); if (m) return m[1]; }
 try { const url = new URL(s); const v = url.searchParams.get('v'); if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v; } catch(e) {}
 return null;
}
function extractYouTubeStartSeconds(input) {
 if (!input) return null;
 const s = input.trim();
 let raw = null;
 try { const url = new URL(s); raw = url.searchParams.get('t') || url.searchParams.get('start'); }
 catch(e) { const m = s.match(/[?&](?:t|start)=([^&\s]+)/); if (m) raw = m[1]; }
 if (!raw) return null;
 if (/^\d+$/.test(raw)) return parseInt(raw);
 const m = raw.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
 if (m && (m[1]||m[2]||m[3])) return (parseInt(m[1]||'0')*3600)+(parseInt(m[2]||'0')*60)+parseInt(m[3]||'0');
 return null;
}

function localDateStr(d) {
 const dt = new Date(d);
 return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function showPage(p, btn) {
 document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
 document.querySelectorAll('.bottom-tab').forEach(x => x.classList.remove('active'));
 document.getElementById('page-' + p).classList.add('active');
 const tabEl = document.getElementById('tab-' + p);
 if (tabEl) tabEl.classList.add('active');

 const isReels = p === 'reels';
 document.getElementById('reels-feed').classList.toggle('fullscreen-mode', isReels);

 if (p === 'games') renderGamesPage();
 else if (p === 'watch') renderWatchPage();

// stats endpoint, so rather than guess at field names that might not exist
// (and silently show wrong numbers), this aggregates real season totals
// straight from each closed game's box score - the same data source
// already proven reliable for Box Score/Team Stats on individual games.
let leagueSeasonStatsCache = null;
async function renderLeagueStats() {
 const el = document.getElementById('league-content');
 el.innerHTML = '<div class="loading"><span class="spinner"></span>Crunching season stats — this can take a moment...</div>';
 try {
 if (!leagueSeasonStatsCache) leagueSeasonStatsCache = await computeSeasonTeamStats();
 const stats = leagueSeasonStatsCache;
 if (!stats.length) { el.innerHTML = '<div class="no-content">No completed games yet this season.</div>'; return; }
 const ranked = [...stats].sort((a,b) => b.runs - a.runs);
 el.innerHTML = `<div class="card" style="padding:0;overflow:hidden">
<div style="overflow-x:auto"><table class="box-table">
<thead><tr><th style="text-align:left">Team</th><th>G</th><th>R</th><th>H</th><th>ERA</th></tr></thead>
<tbody>
${ranked.map(t => `<tr><td style="text-align:left;font-weight:700">${escapeHtml(t.team)}</td><td>${t.games}</td><td>${t.runs}</td><td>${t.hits}</td><td>${t.era}</td></tr>`).join('')}
</tbody></table></div>
</div>`;
 } catch(e) {
 el.innerHTML = `<div class="no-content">Error building season stats: ${e.message}</div>`;
 }
}
// "4.2" innings-pitched notation means 4 and 2/3 innings (baseball's
// thirds-based format), not literally 4.2 - this converts it to real value.
function ipToRealInnings(ip) {
 const whole = Math.floor(ip);
 const frac = Math.round((ip - whole) * 10);
 return whole + (frac === 1 ? 1/3 : frac === 2 ? 2/3 : 0);
}
async function computeSeasonTeamStats() {
 const year = new Date().getFullYear();
 const url = `${BANANA_STATS_BASE}/api/stats/games?dateFrom=${year}-01-01&dateTo=${year}-12-31`;
 const res = await fetch(`${SUPABASE_URL}/functions/v1/banana-proxy?url=` + encodeURIComponent(url), { headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
 const apiGames = (await res.json() || []).filter(g => g.status === 'final');

 const boxScores = await Promise.all(apiGames.map(g => fetchBoxScoreGame(g.id).catch(() => null)));

 const byTeam = {};
 boxScores.forEach(game => {
 if (!game?.teams) return;
 game.teams.forEach(t => {
 if (!byTeam[t.teamName]) byTeam[t.teamName] = { team: t.teamName, games: 0, runs: 0, hits: 0, earnedRuns: 0, innings: 0 };
 const acc = byTeam[t.teamName];
 acc.games++;
 acc.runs += t.prh?.runs ?? (t.batters||[]).reduce((s,b)=>s+(b.R||0),0);
 acc.hits += t.prh?.hits ?? (t.batters||[]).reduce((s,b)=>s+(b.H||0),0);
 (t.pitchers||[]).forEach(p => {
 acc.earnedRuns += p.ER || 0;
 acc.innings += ipToRealInnings(p.IP || 0);
 });
 });
 });

 return Object.values(byTeam).map(t => ({
 ...t,
 era: t.innings > 0 ? ((t.earnedRuns * 9) / t.innings).toFixed(2) : '—'
 }));
}

async function findApiMatch(g) {

 const apiGames = await res.json();
 const match = (apiGames||[]).find(ag =>
 (ag.home_team.name === g.t1 || ag.away_team.name === g.t1) &&
 (ag.home_team.name === g.t2 || ag.away_team.name === g.t2)
 );
 if (!match) return { error: 'No data found for this matchup on that date yet.' };
 if (match.status === 'scheduled') return { error: "Game hasn't started yet — check back once it's underway!", notStarted: true };
 return { match };

function parseNotesSection(notes, sectionType, teamAbbreviations, teamBatters) {
 const result = {};
 for (const abbr of teamAbbreviations) result[abbr] = {};
 if (!notes) return result;
 for (const abbr of teamAbbreviations) {
 const lineMatch = notes.match(new RegExp(`${abbr}\\s+${sectionType}[:\\-]\\s*(.*?)(?=\\n\\s*\\n|\\n[A-Z]{2,4}\\s+(?:HR|3B|2B)[:\\-]|$)`, 's'));
 if (!lineMatch) continue;
 const line = lineMatch[1].trim();
 const entryPattern = /([A-Za-z'.\- ]+?(?:,\s*[A-Z]\.?)?)\s*\d*\s*\(([^)]*)\)/g;
 let entryMatch;
 while ((entryMatch = entryPattern.exec(line)) !== null) {
 const namePart = entryMatch[1].trim();
 const details = entryMatch[2];
 const batters = teamBatters[abbr] || [];
 const matchedFullName = matchNameToBatter(namePart, batters);
 if (!matchedFullName) continue;
 const occurrences = (details.match(/inning/gi) || []).length || 1;
 result[abbr][matchedFullName] = (result[abbr][matchedFullName] || 0) + occurrences;
 }
 }
 return result;
}
function matchNameToBatter(namePart, batters) {
 let lastPart = namePart.toLowerCase();
 let initial = null;
 if (namePart.includes(',')) {
 const [last, init] = namePart.split(',').map(s => s.trim());
 lastPart = last.toLowerCase();
 initial = init.replace(/\.$/, '').toLowerCase();
 }
 const normalize = s => s.toLowerCase().replace(/[.,]/g,'').replace(/\s+/g,' ').trim();
 const lastPartNorm = normalize(lastPart);
 const escaped = lastPartNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
 const boundaryRe = new RegExp(`\\b${escaped}\\b`);
 const candidates = batters.filter(full => boundaryRe.test(normalize(full)));
 if (candidates.length === 1) return candidates[0];
 if (candidates.length > 1 && initial) {
 const narrowed = candidates.filter(c => normalize(c).split(' ').some(w => w.startsWith(initial)));
 if (narrowed.length === 1) return narrowed[0];
 }
 return null;
}

<div class="stat-row"><span class="stat-label">Stolen Bases</span><span class="stat-val">${sum(batters,'SB')}</span></div>
<div class="stat-row"><span class="stat-label">Earned Runs Allowed</span><span class="stat-val">${sum(pitchers,'ER')}</span></div>
<div class="stat-row"><span class="stat-label">Strikeouts (pitching)</span><span class="stat-val">${sum(pitchers,'K')}</span></div>
</div>`;
 }).join('');
 } catch(e) {
 if (myToken === gameTabToken) el.innerHTML = `<div class="no-content">Error: ${e.message}</div>`;
 }
}

async function renderWatchPage() {
 const el = document.getElementById('watch-list');
 el.innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';
 const { data: games } = await sb.from('games').select('*').not('highlight_youtube_id','is',null).order('game_date',{ascending:false}).limit(30);
 if (!games?.length) { el.innerHTML = '<div class="no-content">No highlight videos added yet.</div>'; return; }
 el.innerHTML = games.map(g => `
<div class="watch-row" onclick="openGameDetail('${g.id}');setTimeout(()=>switchGameTab('videos'),50)">
<img class="watch-thumb" src="https://img.youtube.com/vi/${g.highlight_youtube_id}/hqdefault.jpg"/>
<div><div class="watch-info-title">${escapeHtml(g.t1)} vs ${escapeHtml(g.t2)}</div><div class="watch-info-meta">${new Date(g.game_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div></div>
</div>`).join('');
}

let reelsObserver = null;
let reelsMuted = true;
let firstInteractionArmed = false;

window.addEventListener('message', (event) => {
 if (typeof event.data !== 'string') return;
 let data;
 try { data = JSON.parse(event.data); } catch(e) { return; }
 if (data.event !== 'infoDelivery' || typeof data.info?.playerState !== 'number') return;
 document.querySelectorAll('.reel-frame[data-loaded="1"] iframe').forEach(iframe => {
 if (iframe.contentWindow !== event.source) return;
 const frame = iframe.closest('.reel-frame');
 if (frame) frame.dataset.playing = data.info.playerState === 1 ? '1' : '0';
 });
});

function armFirstInteractionUnmute() {
 if (firstInteractionArmed) return;
 firstInteractionArmed = true;
 const unlock = () => {
 if (!reelsMuted) return;
 reelsMuted = false;
 document.querySelectorAll('.reel-mute-btn').forEach(b => b.textContent = '🔊');
 document.querySelectorAll('.reel-frame[data-loaded="1"] iframe').forEach(iframe => {
 iframe.contentWindow?.postMessage(JSON.stringify({ event:'command', func:'unMute', args:[] }), '*');
 });
 };
 const feedEl = document.getElementById('reels-feed');
 ['scroll','touchstart','pointerdown'].forEach(evt => feedEl.addEventListener(evt, unlock, { once:true, passive:true }));
}

async function renderReelsPage() {
 const feedEl = document.getElementById('reels-feed');
 feedEl.innerHTML = '<div class="loading" style="color:#fff"><span class="spinner"></span>Loading reels...</div>';
 const { data: reels, error } = await sb.from('reels').select('*').order('highlight_date',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
 if (error) { feedEl.innerHTML = `<div class="no-content" style="color:#fff">Error loading reels: ${escapeHtml(error.message)}</div>`; return; }
 if (!reels?.length) { feedEl.innerHTML = '<div class="no-content" style="color:#fff">No highlights posted yet — check back soon! 🍌</div>'; return; }
 for (let i = reels.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [reels[i],reels[j]]=[reels[j],reels[i]]; }
 feedEl.innerHTML = reels.map((r,i) => reelItemHTML(r,i)).join('');
 const firstFrame = feedEl.querySelector('.reel-frame');
 if (firstFrame) activateReel(firstFrame);
 armFirstInteractionUnmute();
 if (reelsObserver) reelsObserver.disconnect();
 reelsObserver = new IntersectionObserver((entries) => {
 entries.forEach(entry => {
 const frame = entry.target.querySelector('.reel-frame');
 if (entry.isIntersecting && entry.intersectionRatio > 0.6) activateReel(frame);
 else deactivateReel(frame);
 });
 }, { threshold: [0,0.6,1] });
 feedEl.querySelectorAll('.reel-item').forEach(el => reelsObserver.observe(el));
}
function reelItemHTML(r) {
 const thumbUrl = `https://img.youtube.com/vi/${r.youtube_id}/hqdefault.jpg`;
 return `<div class="reel-item" data-reel-id="${r.id}">
<div class="reel-frame" data-yt-id="${escapeAttr(r.youtube_id)}" data-loaded="0" onclick="toggleReelPlayback(this)">
<img class="reel-thumb" src="${thumbUrl}" loading="lazy" alt=""/>
<div class="reel-play-icon">▶</div>
</div>
<button class="reel-mute-btn" onclick="event.stopPropagation();toggleReelSound(this.closest('.reel-item').querySelector('.reel-frame'))">${reelsMuted?'🔇':'🔊'}</button>
<button class="reel-controls-toggle" onclick="event.stopPropagation();toggleReelControls(this)">⚙ YouTube controls</button>
<div class="reel-info">
<span class="reel-category-badge">${escapeHtml(r.category||'Highlight')}</span>
<div class="reel-title">${escapeHtml(r.title||'')}</div>
<div class="reel-meta">${[r.player,r.team].filter(Boolean).map(escapeHtml).join(' · ')}${r.highlight_date?` · ${new Date(r.highlight_date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`:''}</div>
</div>
</div>`;
}
function toggleReelControls(btn) {
 const frame = btn.closest('.reel-item').querySelector('.reel-frame');
 const active = frame.classList.toggle('controls-active');
 btn.classList.toggle('active', active);
 btn.textContent = active ? '✓ Swipe locked — tap to unlock' : '⚙ YouTube controls';
}
function activateReel(frame) {
 if (!frame || frame.dataset.loaded === '1') return;
 const id = frame.dataset.ytId;
 const mute = reelsMuted ? 1 : 0;
 const iframe = document.createElement('iframe');
 iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=${mute}&playsinline=1&rel=0&modestbranding=1&enablejsapi=1`;
 iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
 iframe.allowFullscreen = true;
 iframe.addEventListener('load', () => {
 [300,700,1200].forEach(delay => setTimeout(() => {
 if (frame.dataset.playing === '1' || frame.dataset.loaded !== '1') return;
 iframe.contentWindow?.postMessage(JSON.stringify({ event:'command', func:'playVideo', args:[] }), '*');
 }, delay));
 });
 frame.querySelector('.reel-thumb')?.remove();
 frame.querySelector('.reel-play-icon')?.remove();
 frame.appendChild(iframe);
 frame.dataset.loaded = '1';
 frame.dataset.playing = '0';
}
function deactivateReel(frame) {
 if (!frame || frame.dataset.loaded !== '1') return;
 frame.querySelector('iframe')?.remove();
 const thumbUrl = `https://img.youtube.com/vi/${frame.dataset.ytId}/hqdefault.jpg`;
 frame.insertAdjacentHTML('afterbegin', `<img class="reel-thumb" src="${thumbUrl}" alt=""/><div class="reel-play-icon">▶</div>`);
 frame.dataset.loaded = '0';
 frame.dataset.playing = '0';
 frame.classList.remove('controls-active');
 const toggleBtn = frame.closest('.reel-item')?.querySelector('.reel-controls-toggle');
 if (toggleBtn) { toggleBtn.classList.remove('active'); toggleBtn.textContent = '⚙ YouTube controls'; }
}
function toggleReelSound(frame) {
 if (!frame) return;
 reelsMuted = !reelsMuted;
 document.querySelectorAll('.reel-mute-btn').forEach(b => b.textContent = reelsMuted?'🔇':'🔊');
 const iframe = frame.querySelector('iframe');
 if (iframe) iframe.contentWindow?.postMessage(JSON.stringify({ event:'command', func: reelsMuted?'mute':'unMute', args:[] }), '*');
 else activateReel(frame);
}
function toggleReelPlayback(frame) {
 if (!frame) return;
 const iframe = frame.querySelector('iframe');
 if (!iframe) { activateReel(frame); return; }
 const playing = frame.dataset.playing === '1';
 iframe.contentWindow?.postMessage(JSON.stringify({ event:'command', func: playing?'pauseVideo':'playVideo', args:[] }), '*');
 frame.dataset.playing = playing?'0':'1';
}

async function adminSignIn() {
 setError('admin-login-error','');
 const email = document.getElementById('admin-email').value.trim();
 const pass = document.getElementById('admin-password').value;
 if (!email || !pass) { setError('admin-login-error','Enter email and password.'); return; }
 const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
 if (error) { setError('admin-login-error', error.message); return; }
 const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', data.user.id).maybeSingle();
 if (!profile?.is_admin) { setError('admin-login-error','This account is not an admin.'); await sb.auth.signOut(); return; }
 currentUser = data.user; isAdmin = true;
 document.getElementById('admin-login-overlay').style.display = 'none';
 toast('Signed in!');
 renderAdminPage();
}

async function renderAdminPage() {
 const el = document.getElementById('admin-content');
 const { data: { session } } = await sb.auth.getSession();
 if (session?.user) {
 const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
 if (profile?.is_admin) { currentUser = session.user; isAdmin = true; }
 }
 if (!isAdmin) {
 document.getElementById('admin-login-overlay').style.display = 'flex';
 el.innerHTML = '<div class="no-content">Sign in to manage BBN.</div>';
 return;
 }

 el.innerHTML = `
<div class="admin-section"><details open><summary>▸ Manage Games</summary>
<div style="margin-top:10px">
<div class="grid2"><div class="input-group"><label>Team 1</label><input class="modal-input" id="ag-t1"/></div><div class="input-group"><label>Team 2</label><input class="modal-input" id="ag-t2"/></div></div>
<div class="input-group"><label>Date/Time</label><input class="modal-input" id="ag-date" type="datetime-local"/></div>
<div class="auth-error" id="ag-error"></div>
<button class="admin-btn" onclick="addGame()">+ Add Game</button>
<div id="admin-games-list" style="margin-top:10px"></div>
</div></details></div>

<div class="admin-section"><details><summary>▸ Peels Reels — Tracked Channels</summary>
<div style="margin-top:10px">
<div class="grid2"><div class="input-group"><label>Channel Handle</label><input class="modal-input" id="rc-handle" placeholder="@TheSavannahBananas"/></div><div class="input-group"><label>Team (optional)</label><input class="modal-input" id="rc-team"/></div></div>
<div class="auth-error" id="rc-error"></div>
<button class="admin-btn" onclick="addReelChannel()">+ Add Channel</button>
<div id="admin-reel-channels-list" style="margin-top:10px"></div>
</div></details></div>

<button class="result-btn" style="width:100%;margin-top:10px" onclick="adminSignOut()">Sign Out</button>
 `;
 renderAdminGamesList();
 renderAdminReelChannelsList();
}

async function adminSignOut() { await sb.auth.signOut(); isAdmin = false; currentUser = null; renderAdminPage(); }

async function addGame() {
 setError('ag-error','');
 const t1 = document.getElementById('ag-t1').value.trim();
 const t2 = document.getElementById('ag-t2').value.trim();
 const date = document.getElementById('ag-date').value;
 if (!t1 || !t2 || !date) { setError('ag-error','Fill in both teams and the date.'); return; }
 const { error } = await sb.from('games').insert({ t1, t2, game_date: new Date(date).toISOString(), status:'open' });
 if (error) { setError('ag-error', error.message); return; }
 ['ag-t1','ag-t2','ag-date'].forEach(id => document.getElementById(id).value = '');
 toast('Game added!'); renderAdminGamesList();
}
async function renderAdminGamesList() {
 const el = document.getElementById('admin-games-list'); if (!el) return;
 const { data: games } = await sb.from('games').select('*').order('game_date',{ascending:false}).limit(20);
 window._bbnAdminGames = games || [];
 el.innerHTML = (games||[]).map(g => `
<div class="admin-item">
<div><strong>${escapeHtml(g.t1)} vs ${escapeHtml(g.t2)}</strong><small>${new Date(g.game_date).toLocaleString()}${g.status==='closed'?' · Winner: '+escapeHtml(g.winner||''):''}</small></div>
<button class="result-btn" onclick="openAdminGameEditor('${g.id}')">Edit</button>
</div>`).join('');
}
function openAdminGameEditor(id) {
 const g = (window._bbnAdminGames||[]).find(x=>x.id===id);
 if (!g) return;
 const winner = prompt(`Winner (leave blank if not final):\n${g.t1}\n${g.t2}`, g.winner||'');
 const recap = prompt('Recap paragraph (leave blank to skip):', g.recap||'');
 const highlightUrl = prompt('Full highlights YouTube URL (leave blank to skip):', g.highlight_youtube_id?`https://youtube.com/watch?v=${g.highlight_youtube_id}${g.highlight_start_seconds?'&t='+g.highlight_start_seconds+'s':''}`:'');
 const updates = {};
 if (winner !== null) { updates.winner = winner || null; updates.status = winner ? 'closed' : 'open'; }
 if (recap !== null) updates.recap = recap || null;
 if (highlightUrl !== null && highlightUrl.trim()) {
 const id2 = extractYouTubeId(highlightUrl);
 if (id2) { updates.highlight_youtube_id = id2; updates.highlight_start_seconds = extractYouTubeStartSeconds(highlightUrl); }
 }
 sb.from('games').update(updates).eq('id', id).then(({error}) => {
 if (error) { toast('Error: '+error.message); return; }
 toast('Game updated!'); renderAdminGamesList();
 });
}

async function addReelChannel() {
 setError('rc-error','');
 let handle = document.getElementById('rc-handle').value.trim();
 const team = document.getElementById('rc-team').value.trim();
 if (!handle) { setError('rc-error','Enter a channel handle.'); return; }
 if (!handle.startsWith('@')) handle = '@' + handle;
 const { error } = await sb.from('reel_channels').insert({ handle, team: team||null });
 if (error) { setError('rc-error', error.message); return; }
 document.getElementById('rc-handle').value=''; document.getElementById('rc-team').value='';
 toast('Channel added!'); renderAdminReelChannelsList();
}
async function renderAdminReelChannelsList() {
 const el = document.getElementById('admin-reel-channels-list'); if (!el) return;
 const { data: channels } = await sb.from('reel_channels').select('*').order('created_at',{ascending:true});
 el.innerHTML = (channels||[]).map(c => `
<div class="admin-item"><div><strong>${escapeHtml(c.handle)}</strong><small>${c.team?escapeHtml(c.team):'General Banana Ball'}</small></div>
<button class="result-btn" onclick="deleteReelChannel('${c.id}')">Delete</button></div>`).join('') || '<div class="no-content">None yet.</div>';
}
async function deleteReelChannel(id) { await sb.from('reel_channels').delete().eq('id',id); toast('Removed.'); renderAdminReelChannelsList(); }

async function boot() {
 try {
 const { data: { session } } = await sb.auth.getSession();
 if (session?.user) {
 const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
 if (profile?.is_admin) { currentUser = session.user; isAdmin = true; }
 }
 } catch(e) { console.error('Boot error:', e); }
 renderGamesPage();
}
boot();
</script>
